name: AuthForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint & Test Matrix
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: authforge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      APP_PORT: 3000
      APP_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: authforge_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-super-secret-jwt-key-minimum-32-chars!
      JWT_ACCESS_SECRET: ci-super-secret-access-key-minimum-32-chars!
      JWT_REFRESH_SECRET: ci-super-secret-refresh-key-minimum-32-chars!
      JWT_EXPIRES_IN: 15m
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      COOKIE_SECURE: false
      COOKIE_SAME_SITE: lax

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Run Unit Tests with Coverage
        run: npm test -- --coverage

      - name: Run End-to-End Tests
        run: npm run test:e2e

      - name: Run Production Bundle Build
        run: npm run build

      - name: Verify Docker Container Build
        run: docker build -t authforge:${{ github.sha }} .

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Dependencies for High/Critical Vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true
